name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android --project-name visiting_card_app .
      - name: Set app name
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Visiting Card Holder"/' android/app/src/main/AndroidManifest.xml
      - name: Disable R8 minify
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/signingConfig = signingConfigs.getByName("debug")/signingConfig = signingConfigs.getByName("debug")\n            isMinifyEnabled = false\n            isShrinkResources = false/' android/app/build.gradle.kts
          else
            sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.debug\n            minifyEnabled false\n            shrinkResources false/' android/app/build.gradle
          fi
      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          base64 -d .github/debug.keystore.b64 > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: visiting-card-apk
          path: build/app/outputs/flutter-apk/app-release.apk
